name: CI — container build & validate

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build validation image
        run: |
          docker build -f Dockerfile.ci -t ballotbuilder:${{ github.sha }} .

      - name: Run tests inside validation image (unit + a11y)
        run: |
          mkdir -p artifacts
          docker run --rm -v "${{ github.workspace }}:/app" -v "${{ github.workspace }}/artifacts:/artifacts" -w /app ballotbuilder:${{ github.sha }} sh -c "npm ci && npm test -- --ci --json --outputFile=/artifacts/test-results.json && npm run test:a11y || true"

      - name: Trivy image scan (fail on CRITICAL/HIGH)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest --exit-code 1 --severity CRITICAL,HIGH ballotbuilder:${{ github.sha }} || (echo 'Trivy reported findings' && exit 1)

      - name: Secrets detection (gitleaks)
        uses: zricethezav/gitleaks-action@v2
        with:
          args: --no-git -v

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: container-validation-artifacts
          path: artifacts
